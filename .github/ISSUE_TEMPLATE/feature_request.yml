name: "Feature request"
description: "Suggest a NeoTerm improvement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Feature description
      description: What would you like to see, and why?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed approach
      description: |
        If you have an idea for the implementation, describe it here. Remember the focus
        contract, the non-animated collapse, and the pure-JVM theme core.
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Any other terminals or projects that do this well? Add links.
