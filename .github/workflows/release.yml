name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0). Leave blank to build from the current SHA.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install exact SDK platform and NDK from gradle.properties
        shell: bash
        run: |
          COMPILE_SDK_VERSION="$(grep '^compileSdkVersion=' gradle.properties | cut -d= -f2)"
          NDK_VERSION="$(grep '^ndkVersion=' gradle.properties | cut -d= -f2)"
          sdkmanager "platforms;android-${COMPILE_SDK_VERSION}" "ndk;${NDK_VERSION}"

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            CURRENT_VERSION_NAME="$(grep -m 1 -E '\s+versionName "([^"]+)"$' ./app/build.gradle | sed -r 's/\s+versionName "([^"]+)"$/\1/')"
            TAG="v${CURRENT_VERSION_NAME}+${GITHUB_SHA:0:7}"
          fi
          printf 'Releasing tag: %s\n' "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build ARM64 + universal APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          APK_TAG="${TAG}-apt-android-7-github-debug"
          SRC="./app/build/outputs/apk/debug"
          DIST="./dist"
          PREFIX="termux-app_${APK_TAG}"
          mkdir -p "$DIST"

          export TERMUX_APK_VERSION_TAG="$APK_TAG"
          export TERMUX_PACKAGE_VARIANT="apt-android-7"

          # splits.abi.reset()+include('arm64-v8a') with universalApk true produces both
          # the ABI split and a single-file ARM64 APK in one pass. Never disable splits
          # here: AGP then ignores the include list and tries to build armeabi-v7a, whose
          # bootstrap-arm.zip this ARM64-only fork does not ship.
          echo "::group::Build ARM64 split + universal APK"
          ./gradlew assembleDebug
          echo "::endgroup::"

          for ABI in arm64-v8a universal; do
            APK="$SRC/${PREFIX}_${ABI}.apk"
            if [ ! -f "$APK" ]; then
              echo "Missing $APK"; ls -la "$SRC"; exit 1
            fi
            cp "$APK" "$DIST/"
          done

          echo "::group::Generate SHA256SUMS.txt"
          (cd "$DIST" && sha256sum *.apk > SHA256SUMS.txt)
          cat "$DIST/SHA256SUMS.txt"
          echo "::endgroup::"

      - name: Publish public release with auto-generated notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          gh release create "$TAG" \
            --title "NeoTerm $TAG" \
            --generate-notes \
            --public \
            dist/*.apk dist/SHA256SUMS.txt
