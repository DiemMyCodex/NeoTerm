name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.22.2). Leave blank to build from the current SHA.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional release keystore. When absent we reuse the CI debug keystore so
      # existing installs keep the same signing identity and can upgrade in place.
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install exact SDK platform, build-tools and NDK from gradle.properties
        shell: bash
        run: |
          COMPILE_SDK_VERSION="$(grep '^compileSdkVersion=' gradle.properties | cut -d= -f2)"
          NDK_VERSION="$(grep '^ndkVersion=' gradle.properties | cut -d= -f2)"
          # zipalign/apksigner live in build-tools, not in the platform package.
          sdkmanager "platforms;android-${COMPILE_SDK_VERSION}" \
                     "build-tools;${COMPILE_SDK_VERSION}.0.0" \
                     "ndk;${NDK_VERSION}"

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            CURRENT_VERSION_NAME="$(grep -m 1 -E '\s+versionName "([^"]+)"$' ./app/build.gradle | sed -r 's/\s+versionName "([^"]+)"$/\1/')"
            TAG="v${CURRENT_VERSION_NAME}+${GITHUB_SHA:0:7}"
          fi
          printf 'Releasing tag: %s\n' "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build ARM64 + universal APKs
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          APK_TAG="${TAG}-apt-android-7-github-debug"
          SRC="./app/build/outputs/apk/debug"
          DIST="./dist"
          PREFIX="neoterm_${APK_TAG}"
          mkdir -p "$DIST"

          export TERMUX_APK_VERSION_TAG="$APK_TAG"
          export TERMUX_PACKAGE_VARIANT="apt-android-7"

          # splits.abi.reset()+include('arm64-v8a') with universalApk true produces both
          # the ABI split and a single-file ARM64 APK in one pass. Never disable splits
          # here: AGP then ignores the include list and tries to build armeabi-v7a, whose
          # bootstrap-arm.zip this ARM64-only fork does not ship.
          echo "::group::Build ARM64 split + universal APK"
          ./gradlew assembleDebug
          echo "::endgroup::"

          for ABI in arm64-v8a universal; do
            APK="$SRC/${PREFIX}_${ABI}.apk"
            if [ ! -f "$APK" ]; then
              echo "Missing $APK"; ls -la "$SRC"; exit 1
            fi
            cp "$APK" "$DIST/"
          done

      - name: Zipalign and sign every release APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          echo "Using build-tools $BUILD_TOOLS"

          # Keystore precedence: configured release secret > exact keystore used by CI
          # debug builds > Android's debug keystore. Never ship an unsigned APK.
          KEYSTORE="/tmp/neoterm-release.jks"
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "Signing with configured RELEASE_KEYSTORE secret"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            KS_ALIAS="${RELEASE_KEY_ALIAS:?RELEASE_KEY_ALIAS is required with RELEASE_KEYSTORE_BASE64}"
            KS_PASS="${RELEASE_KEYSTORE_PASSWORD:?RELEASE_KEYSTORE_PASSWORD is required with RELEASE_KEYSTORE_BASE64}"
            KEY_PASS="${RELEASE_KEY_PASSWORD:-$KS_PASS}"
          elif [ -f app/testkey_untrusted.jks ]; then
            echo "Signing with the CI debug keystore (same identity as debug_build.yml)"
            cp app/testkey_untrusted.jks "$KEYSTORE"
            KS_ALIAS="alias"
            KS_PASS="xrj45yWGLbsO7W0v"
            KEY_PASS="$KS_PASS"
          else
            echo "Signing with ~/.android/debug.keystore fallback"
            cp "$HOME/.android/debug.keystore" "$KEYSTORE"
            KS_ALIAS="androiddebugkey"
            KS_PASS="android"
            KEY_PASS="android"
          fi

          shopt -s nullglob
          APK_LIST=(dist/*.apk)
          if [ "${#APK_LIST[@]}" -eq 0 ]; then echo "No release APKs found"; exit 1; fi

          for APK in "${APK_LIST[@]}"; do
            echo "::group::Aligning and signing $APK"
            "$ZIPALIGN" -f -p 4 "$APK" "$APK.aligned"
            mv "$APK.aligned" "$APK"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$KS_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$APK"
            echo "::endgroup::"
          done
          rm -f "$KEYSTORE"

      - name: Verify signatures and generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          shopt -s nullglob
          APK_LIST=(dist/*.apk)
          if [ "${#APK_LIST[@]}" -eq 0 ]; then echo "No release APKs to verify"; exit 1; fi

          for APK in "${APK_LIST[@]}"; do
            echo "::group::apksigner verify --verbose $APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$APK.verify.txt"
            # apksigner verify alone accepts a v1-only APK; require all three schemes
            # explicitly so the earlier v1-only signing incident cannot recur.
            grep -q 'Verified using v1 scheme (JAR signing): true' "$APK.verify.txt"
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$APK.verify.txt"
            grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "$APK.verify.txt"
            echo "::endgroup::"
          done

          echo "::group::Generate SHA256SUMS.txt"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          echo "::endgroup::"

      - name: Publish public release with auto-generated notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # Releases are public by default in gh; there is no --public flag.
          gh release create "$TAG" \
            --title "NeoTerm $TAG" \
            --generate-notes \
            --verify-tag \
            dist/*.apk dist/SHA256SUMS.txt
