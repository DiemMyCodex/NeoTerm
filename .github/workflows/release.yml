name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0). Leave blank to build from the current SHA.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install exact SDK platform and NDK from gradle.properties
        shell: bash
        run: |
          COMPILE_SDK_VERSION="$(grep '^compileSdkVersion=' gradle.properties | cut -d= -f2)"
          NDK_VERSION="$(grep '^ndkVersion=' gradle.properties | cut -d= -f2)"
          sdkmanager "platforms;android-${COMPILE_SDK_VERSION}" "ndk;${NDK_VERSION}"

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            CURRENT_VERSION_NAME="$(grep -m 1 -E '\s+versionName "([^"]+)"$' ./app/build.gradle | sed -r 's/\s+versionName "([^"]+)"$/\1/')"
            TAG="v${CURRENT_VERSION_NAME}+${GITHUB_SHA:0:7}"
          fi
          printf 'Releasing tag: %s\n' "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build ARM64 + universal APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          APK_TAG="${TAG}-apt-android-7-github-debug"
          SRC="./app/build/outputs/apk/debug"
          DIST="./dist"
          PREFIX="termux-app_${APK_TAG}"
          mkdir -p "$DIST"

          export TERMUX_APK_VERSION_TAG="$APK_TAG"
          export TERMUX_PACKAGE_VARIANT="apt-android-7"

          echo "::group::Build ARM64 (ABI split)"
          ./gradlew assembleDebug
          echo "::endgroup::"

          ARM64="$SRC/${PREFIX}_arm64-v8a.apk"
          if [ ! -f "$ARM64" ]; then
            echo "Missing $ARM64"; ls -la "$SRC"; exit 1
          fi
          cp "$ARM64" "$DIST/"

          echo "::group::Build universal (splits disabled)"
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS=0 ./gradlew assembleDebug
          echo "::endgroup::"

          UNIVERSAL="$SRC/${PREFIX}_universal.apk"
          if [ ! -f "$UNIVERSAL" ]; then
            echo "Missing $UNIVERSAL"; ls -la "$SRC"; exit 1
          fi
          cp "$UNIVERSAL" "$DIST/"

          echo "::group::Generate SHA256SUMS.txt"
          (cd "$DIST" && sha256sum *.apk > SHA256SUMS.txt)
          cat "$DIST/SHA256SUMS.txt"
          echo "::endgroup::"

      - name: Publish public release with auto-generated notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          gh release create "$TAG" \
            --title "NeoTerm $TAG" \
            --generate-notes \
            --public \
            dist/*.apk dist/SHA256SUMS.txt
